<div class="github-section r">
  <div class="gh-header">
    <div class="gh-title"><span class="gh-title-icon">⬡</span> Code Activity — 2025</div>
    <div class="gh-stats">
      <div class="gh-stat"><div class="gh-stat-num">340+</div><div>Commits</div></div>
      <div class="gh-stat"><div class="gh-stat-num">52wk</div><div>Streak</div></div>
    </div>
  </div>
  <div class="gh-heatmap" id="gh-heatmap" aria-label="GitHub-style contribution heatmap"></div>
  <div class="gh-legend">
    <div class="gh-legend-label">Less</div>
    <div class="gh-legend-boxes">
      <div class="gh-legend-box" style="background:var(--raised)"></div>
      <div class="gh-legend-box" data-l="1" style="background:rgba(124,58,237,.25)"></div>
      <div class="gh-legend-box" data-l="2" style="background:rgba(124,58,237,.45)"></div>
      <div class="gh-legend-box" data-l="3" style="background:rgba(124,58,237,.7)"></div>
      <div class="gh-legend-box" data-l="4" style="background:var(--v3)"></div>
    </div>
    <div class="gh-legend-label">More</div>
  </div>
</div>
