<div class="metrics-row" role="list" aria-label="Key metrics" id="metrics-row">
  <div class="metric-enhanced" role="listitem">
    <div class="card-shine" aria-hidden="true"></div>
    <div class="tower-wrap">
      <div class="tower" style="--tower-h: 80px; --tower-c: var(--v); --tower-delay: 0s">
        <div class="tower-face tower-front"></div>
        <div class="tower-face tower-back"></div>
        <div class="tower-face tower-left"></div>
        <div class="tower-face tower-right"></div>
        <div class="tower-face tower-top"></div>
        <div class="tower-data">
          <div class="metric-gauge-num" data-t="50" data-s="M+">50M+</div>
        </div>
      </div>
    </div>
    <div class="metric-label">Monthly Transaction Volume</div>
    <div class="metric-sub">Architect of record for banking platform</div>
    <div class="metric-pulse-line"></div>
  </div>

  <div class="metric-enhanced narrative-track" role="listitem">
    <div class="card-shine" aria-hidden="true"></div>
    
    <div class="lcp-chart-container">
       <div class="lcp-val-old">11s</div>
       <div class="lcp-val-new">2s</div>
       <svg class="lcp-svg" viewBox="0 0 100 60" preserveAspectRatio="none">
          <path class="lcp-path-bg" d="M0,10 C40,10 60,50 100,50" />
          <path class="lcp-path" d="M0,10 C40,10 60,50 100,50" />
          <circle class="lcp-dot" cx="100" cy="50" r="4" />
       </svg>
       <div class="metric-gauge-num c-col lcp-overlay-num" data-t="82" data-s="%">82%</div>
    </div>

    <div class="metric-label">Load-Time Reduction</div>
    <div class="metric-sub">11s → 2s via Zoneless + Signals</div>
    <div class="metric-pulse-line"></div>
  </div>

  <div class="metric-enhanced live-heartbeat" role="listitem">
    <div class="card-shine" aria-hidden="true"></div>
    
    <div class="heartbeat-container">
      <div class="hb-status">
        <div class="hb-dot"></div>
        <span>RAG PERFORMANCE</span>
      </div>
      <div class="hb-value">98%+</div>
      <svg class="hb-graph" viewBox="0 0 200 60" preserveAspectRatio="none">
        <path class="hb-path" d="M0,30 L40,30 L50,10 L60,50 L70,30 L100,30 L110,15 L120,45 L130,30 L200,30" />
      </svg>
      <div class="hb-grid"></div>
    </div>

    <div class="metric-label" style="margin-top: 10px;">GenAI Accuracy</div>
    <div class="metric-sub">5-layer hallucination mitigation</div>
  </div>

  <div class="metric-enhanced" role="listitem">
    <div class="card-shine" aria-hidden="true"></div>
    <div class="tower-wrap">
      <div class="tower" style="--tower-h: 40px; --tower-c: var(--gold2); --tower-delay: 0.45s">
        <div class="tower-face tower-front"></div>
        <div class="tower-face tower-back"></div>
        <div class="tower-face tower-left"></div>
        <div class="tower-face tower-right"></div>
        <div class="tower-face tower-top"></div>
        <div class="tower-data">
          <div class="metric-gauge-num gold-col" data-t="7" data-s="">7</div>
        </div>
      </div>
    </div>
    <div class="metric-label">Engineers Grown</div>
    <div class="metric-sub">Intern to Senior mentorship</div>
    <div class="metric-pulse-line"></div>
  </div>
</div>
